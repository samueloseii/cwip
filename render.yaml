databases:
  - name: flow-db
    plan: free
    databaseName: flow
    user: flow

services:
  - type: web
    name: flow
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd backend && python -m app.db.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20.11.1"
